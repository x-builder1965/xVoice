<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>xVoice - AivisSpeech Client</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="renderer.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="header">
                <div class="title-group">
                    <h1 class="app-title">
                        <img src="xVoice.ico" alt="xVoice Icon" class="title-icon">
                        xVoice -テキスト音声読み上げ- 
                    </h1>
                    <div class="ver-title">Ver1.00.0</div>
                </div>
                <button id="btn-theme" class="theme-toggle" aria-label="テーマ切替" title="テーマ切替 (Ctrl+t)">☀️</button>
            </div>

            <!-- トースト通知用オーバーレイ -->
            <div id="toast-message" class="toast hidden"></div>
            
            <!-- ローディング表示用オーバーレイ -->
            <div id="loading-overlay" class="loading-overlay hidden">
                <i class="fa fa-refresh fa-spin fa-5x fa-fw" style="color: rgb(134, 201, 228)"></i>
            </div>

            <!-- サーバー接続および話者選択フィールド -->
            <div class="field">
                <div class="file-input-group">
                    <select id="speaker"><option value="">エンジン起動確認中...</option></select>
                    <button id="btn-connect" class="file-select-btn" type="button" title="AivisSpeech Engine接続 (Ctrl+n)">🔄</button>
                    <input type="text" id="input-address" placeholder="http://127.0.0.1:10101" title="サーバーアドレス">
                </div>
            </div>

            <!-- ファイル選択・テキスト設定コントロール部 -->
            <div class="field">
                <div class="file-input-group">
                    <select id="font-size-select" title="文字サイズ変更">
                        <option value="12px">小</option>
                        <option value="16px" selected>中</option>
                        <option value="20px">大</option>
                        <option value="24px">特大</option>
                    </select>
                    <select id="writing-mode-select" title="テキスト向き">
                        <option value="horizontal-tb" selected>横向き</option>
                        <option value="vertical-rl">縦向き</option>
                    </select>
                    <button id="btn-folder-select" class="btn-primary" title="フォルダ選択 (Ctrl+d)">📁</button>
                    <button id="btn-file-select" class="btn-primary" title="ファイル選択 (Ctrl+f)">🗒️</button>
                    <select id="file-path-display" class="file-path-display" title="プレイリスト">
                        <option value="">選択されていません</option>
                    </select>
                    <button id="btn-ruby" class="btn-primary" title="読み編集 (Ctrl+h)">🖊️</button>
                    <button id="btn-unity" class="btn-primary" title="読み統一 (Ctrl+u)">🔠</button>
                    <button id="btn-search" class="btn-primary" title="編集検索 (Ctrl+b)">🔍</button>
                    <div class="separator">　</div>
                    <button id="btn-save" class="btn-primary" title="テキスト保存 (Ctrl+s)">💾</button>
                    <button id="btn-playlist-save" class="btn-primary" title="プレイリスト保存 (Ctrl+l)">📚</button>
                    <div class="separator">　</div>
                    <button id="btn-file-clear" class="file-select-btn" type="button" title="テキストクリア (Ctrl+c)">🗑️</button>
                </div>
            </div>

            <!-- テキスト入力エリア -->
            <div class="field field-text">
                <textarea id="text-input" placeholder="テキストを入力するか、ファイルを読み込んでください..."></textarea>
            </div>

            <!-- ステータス・プログレスバー部分 -->
            <div class="field">
                <div class="progress-wrapper">
                    <!-- 再生・生成ボタン群 -->
                    <button id="btn-prev-file" class="btn-primary" title="前ファイル (Ctrl+PgUp)">⏮️</button>
                    <button id="btn-prev-line" class="btn-primary" title="前１０行 (Ctrl+←)">⏪</button>
                    <button id="btn-speak" class="btn-primary" title="再生 (Ctrl+Space)">▶️</button>
                    <button id="btn-next-line" class="btn-primary" title="次１０行 (Ctrl+→)">⏩</button>
                    <button id="btn-next-file" class="btn-primary" title="次ファイル (Ctrl+PgDown)">⏭️</button>
                    <div class="separator">　</div>
                    <button id="btn-generate" class="btn-secondary" title="音声生成 (Ctrl+g)">🎤</button>
                    <div class="separator">　</div>
                    <!-- 音量コントロール群 -->
                    <button type="button" id="btn-mute" class="btn-mute" title="ミュート設定（Ctrl+m）">🔊</button>
                    <span id="volume-display" class="volume-display">  0%</span>
                    <input type="range" id="volume-slider" min="0" max="100" value="20" class="volume-slider">
                    <!-- 再生速度変更 -->
                    <select id="speedSelect" data-tooltip="再生速度（Ctrl+.／Ctrl+,）">
                        <option value="0.25">0.25x</option>
                        <option value="0.50">0.50x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1.00" selected>1.00x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.50">1.50x</option>
                        <option value="1.75">1.75x</option>
                        <option value="2.00">2.00x</option>
                        <option value="2.50">2.50x</option>
                        <option value="3.00">3.00x</option>
                        <option value="5.00">5.00x</option>
                    </select>
                    <!-- 進捗表示・シークバー群 -->
                    <span id="progress-count" class="progress-count">    0/   0行</span>
                    <progress id="engine-progress" value="0" max="100" class="engine-progress" hidden></progress>
                    <div id="text-progress-container" class="progress-container">
                        <progress id="text-buffer-progress" value="0" max="100" class="text-buffer-progress"></progress>
                        <progress id="text-progress" value="0" max="100" class="text-progress"></progress>
                    </div>
                    <progress id="mp3-progress" value="0" max="100" class="mp3-progress" hidden></progress>
                    <progress id="playlist-progress" value="0" max="100" class="playlist-progress" hidden></progress>
                    <!-- キャッシュ表示群 -->
                    <button type="button" id="cache-btn" class="cache-btn" title="キャッシュ量変更（Ctrl+↑↓）">👁️</button>
                    <span id="cache-count-display" class="cache-count-display">  0/  0件</span>
                    <input type="range" id="cache-limit-slider" min="1" max="100" value="10" class="cache-limit-slider">
                </div>
            </div>
            <div class="status-display" id="status-display">AivisSpeech Engineに接続中...</div>

            <!-- 再生プレイヤー -->
            <audio id="audio-player" class="audio-player-element hidden-player" controls></audio>
            <audio id="audio-player-next" class="audio-player-element hidden-player" controls></audio>
        </div>

        <!-- ヘルプ -->
        <div class="help-container">
            <div class="header-row">
                <h1>xVoice -テキスト音声読み上げ- Ver1.00.0 ヘルプ</h1>
                <button id="helpCloseBtn" class="btn-Close" title="ヘルプ閉じる（Escape）">❌</button>
            </div>
            <div id="helpTableContainer" class="help-table-container"></div>
        </div>

        <!-- 変更履歴 -->
        <div class="changelog-container">
            <div class="header-row">
                <h1>xVoice -テキスト音声読み上げ- Ver1.00.0 変更履歴</h1>
                <button id="changelogCloseBtn" class="btn-Close" title="変更履歴閉じる（Escape）">❌</button>
            </div>
            <div id="appConfigContainer" class="app-config-container" style="display: none;"></div>
            <div id="changelogContent" class="changelog-Content"></div>
        </div>

        <!-- copyright＆email -->
        <div class="copyright-container">
            <span class="email-text" id="email-text">x-builder@gmail.com</span>
            <span class="copyright-text" id="copyright-text">Copyright © 2026- @x-builder, Japan</span>
        </div>
    </div>
</body>
</html>
